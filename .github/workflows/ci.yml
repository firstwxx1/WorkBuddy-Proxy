name: CI
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: bash -n panel.sh workbuddy-deploy.sh workbuddy-manager/deploy/install.sh
      - run: find workbuddy-manager/server -name '*.py' -exec python3 -m py_compile {} +
