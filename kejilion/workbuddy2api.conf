# WorkBuddy 反代（WorkBuddy-Proxy）· 科技Lion（kejilion.sh）应用配置
#
# 放到 /root/apps/workbuddy2api.conf，然后运行 kejilion.sh 即可在应用列表里看到它。
#
# 与上游 macsur/WorkBuddy 的 conf 的差别：
#   · 源码来自本仓库 firstwxx1/WorkBuddy-Proxy（含逐账号出站代理补丁）
#   · 用本仓库的 workbuddy-deploy.sh 一键脚本，而不是只跑上游 --auto
#   · 保留 kejilion 的域名/证书管理入口（反向代理交给 kejilion.sh 建站菜单）
#
# 依赖的 kejilion.sh 接口（均已在生产环境验证）：
#   docker_app_install / docker_app_update / docker_app_uninstall / docker_app_plus

local app_id="workbuddy2api"
local app_name="WorkBuddy 反代（账号池 API 网关 + 面板）"
local app_text="WorkBuddy 账号池 OpenAI 兼容网关 + 管理面板（含逐账号出站代理）"
local app_url="https://github.com/firstwxx1/WorkBuddy-Proxy"
local docker_name="workbuddy-manager"
local docker_port="7864"
local app_size="4"

workbuddy2api_app_dir() {
    printf '%s\n' /opt/wb2api
}

# 本仓库的部署脚本地址（raw 直链）
workbuddy2api_deploy_url() {
    printf '%s\n' "${gh_proxy:-https://}raw.githubusercontent.com/firstwxx1/WorkBuddy-Proxy/main/workbuddy-deploy.sh"
}

# 下载并执行本仓库的一键部署脚本。
# $1 = 管理端口（面板宿主侧端口，kejilion 用它做反代目标）
workbuddy2api_fetch_and_run() {
    local manager_port="$1" script_file status
    local expected_hash="${WB2API_DEPLOY_SHA256:-}"

    script_file="$(mktemp /tmp/workbuddy-proxy-deploy.XXXXXX)" || return 1
    if ! curl -fsSL --connect-timeout 10 --max-time 90 --retry 2 \
        -o "$script_file" "$(workbuddy2api_deploy_url)"; then
        rm -f -- "$script_file"
        echo "下载 WorkBuddy 反代部署脚本失败（网络不通 raw.githubusercontent.com？）" >&2
        return 1
    fi

    # 语法校验：脚本至少要能被 bash 解析
    if ! bash -n "$script_file"; then
        rm -f -- "$script_file"
        echo "部署脚本语法校验失败，已停止安装" >&2
        return 1
    fi

    # 可选：设置 WB2API_DEPLOY_SHA256 环境变量做哈希钉死
    if [ -n "$expected_hash" ]; then
        local actual_hash
        actual_hash="$(sha256sum "$script_file" | awk '{print $1}')" || {
            rm -f -- "$script_file"; return 1
        }
        if [ "$actual_hash" != "$expected_hash" ]; then
            rm -f -- "$script_file"
            echo "部署脚本哈希不匹配（期望 $expected_hash，实际 $actual_hash），已停止安装" >&2
            return 1
        fi
    fi

    # 域名与证书交给 kejilion.sh 的建站/反代菜单，这里不配 DOMAIN，
    # 避免脚本自己装 Caddy 与 kejilion 的 Nginx 抢 80/443。
    NONINTERACTIVE=1 \
    BASE_DIR="$(workbuddy2api_app_dir)" \
    MANAGER_PORT="$manager_port" \
    DOMAIN= API_DOMAIN= \
        bash "$script_file" install --auto
    status=$?
    rm -f -- "$script_file"
    return "$status"
}

workbuddy2api_deploy() {
    local manager_port="$1"

    if ! printf '%s' "$manager_port" | grep -qE '^[0-9]+$' ||
       [ "$manager_port" -lt 1 ] || [ "$manager_port" -gt 65535 ]; then
        echo "WorkBuddy 反代管理端口无效：$manager_port" >&2
        return 1
    fi

    workbuddy2api_fetch_and_run "$manager_port" || return 1
    return 0
}

docker_app_install() {
    local app_dir container
    app_dir="$(workbuddy2api_app_dir)"

    if [ -L "$app_dir" ]; then
        echo "安装目录是符号链接，拒绝写入：$app_dir" >&2
        return 1
    fi

    if [ -e "$app_dir" ] && [ ! -f "$app_dir/.kejilion-app" ]; then
        echo "安装目录已存在且不属于本应用：$app_dir" >&2
        return 1
    fi

    if [ ! -e "$app_dir" ]; then
        for container in workbuddy2api workbuddy-manager; do
            if docker container inspect "$container" >/dev/null 2>&1; then
                echo "容器 $container 已存在，拒绝覆盖已有部署" >&2
                return 1
            fi
        done
        mkdir -p -- "$app_dir" || return 1
        : > "$app_dir/.kejilion-app" || return 1
    fi

    if ! docker network inspect wbnet >/dev/null 2>&1; then
        : > "$app_dir/.kejilion-created-wbnet" || return 1
    fi

    workbuddy2api_deploy "$docker_port" || return 1

    echo "WorkBuddy 网关与面板仅监听本机 127.0.0.1（网关 7863 / 面板 ${docker_port}）。"
    echo "需要公网访问时，请在 kejilion.sh 建站菜单中添加 HTTPS 反向代理，目标 127.0.0.1:${docker_port}。"
    echo "初始凭据保存在 $app_dir/.credentials，请勿公开。"
    echo "逐账号出站代理：面板「账号」页每行的地球按钮，或终端跑 $app_dir/../../workbuddy-deploy.sh 菜单 7。"
}

docker_app_update() {
    local app_dir manager_port
    app_dir="$(workbuddy2api_app_dir)"

    if [ -L "$app_dir" ] || [ ! -f "$app_dir/.kejilion-app" ] ||
       [ ! -f "$app_dir/.credentials" ]; then
        echo "未找到本应用的安装记录，拒绝更新" >&2
        return 1
    fi

    manager_port="$docker_port"
    if [ -f /home/docker/workbuddy-manager_port.conf ]; then
        manager_port="$(cat /home/docker/workbuddy-manager_port.conf)" || return 1
    fi

    workbuddy2api_deploy "$manager_port"
}

docker_app_uninstall() {
    local app_dir network_members
    app_dir="$(workbuddy2api_app_dir)"

    if [ -L "$app_dir" ] || [ ! -f "$app_dir/.kejilion-app" ] ||
       [ ! -f "$app_dir/workbuddy2api/docker-compose.yml" ] ||
       [ ! -f "$app_dir/workbuddy-manager/docker-compose.yml" ]; then
        echo "安装目录不完整或不属于本应用，拒绝卸载" >&2
        return 1
    fi

    docker compose -f "$app_dir/workbuddy-manager/docker-compose.yml" down --rmi all || return 1
    docker compose -f "$app_dir/workbuddy2api/docker-compose.yml" down --rmi all || return 1

    # 兜底：漏网容器 / 镜像
    docker rm -f workbuddy-manager workbuddy2api >/dev/null 2>&1 || true
    docker rmi -f workbuddy-manager:proxy-patched workbuddy2api:proxy-patched >/dev/null 2>&1 || true

    if [ -f "$app_dir/.kejilion-created-wbnet" ] &&
       docker network inspect wbnet >/dev/null 2>&1; then
        network_members="$(docker network inspect wbnet --format '{{len .Containers}}')" || return 1
        if [ "$network_members" = "0" ]; then
            docker network rm wbnet >/dev/null || return 1
        fi
    fi

    rm -rf -- "$app_dir" || return 1
    rm -f /home/docker/workbuddy-manager_access.conf /home/docker/workbuddy-manager_port.conf 2>/dev/null || true
    echo "WorkBuddy 反代已卸载。独立配置的域名反代需在建站菜单中删除。"
}

docker_app_plus
